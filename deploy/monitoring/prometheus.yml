# Prometheus scrape /metrics của Juice Shop qua mạng nội bộ backend (không ra host).
global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: juice-shop
    metrics_path: /metrics
    static_configs:
      - targets: ['juice-app-juice-shop-1:3000']
        labels: { service: juice-shop }
