worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 256; }
http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server_tokens off;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    map $uri $safe_route {
        default "other";
        /rest/user/login "/rest/user/login";
        /metrics "/metrics";
        ~^/rest/basket/[0-9]+/checkout$ "/rest/basket/:id/checkout";
    }
    log_format security escape=json
      '{"timestamp":$msec,"request_id":"$request_id","srcip":"$remote_addr","request_method":"$request_method",'
      '"request_uri":"$safe_route","http_status":$status,"request_time":$request_time}';
    access_log /dev/stdout security;
    access_log /logs/access.log security;
    limit_req_zone $binary_remote_addr zone=login:1m rate=5r/m;
    server {
        listen 8080;
        client_max_body_size 1m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        location = /metrics { return 404; }
        location ^~ /metrics/ { return 404; }
        location = /rest/user/login {
            limit_req zone=login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://juice-shop:3000;
        }
        location / { proxy_pass http://juice-shop:3000; }
    }
}
